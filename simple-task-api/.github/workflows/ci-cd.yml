name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------
  # 1) Build + Lint + Test (roda sempre, inclusive em Pull Requests)
  # ---------------------------------------------------------------------
  build-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessário para análise completa do Sonar

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes + cobertura
        run: npm test

      - name: Upload cobertura (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  # ---------------------------------------------------------------------
  # 2) Security Scan — SonarCloud/SonarQube (gate obrigatório)
  # ---------------------------------------------------------------------
  security-scan:
    name: SonarQube Scan
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cobertura para o Sonar
        run: npm test

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          # Aponte para SonarCloud (padrão) ou para seu servidor self-hosted
          # trocando SONAR_HOST_URL pelo endereço do seu SonarQube.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------------
  # 3) Build & Push da imagem Docker (somente na branch main)
  # ---------------------------------------------------------------------
  docker-build-push:
    name: Build & Push Docker Image
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ---------------------------------------------------------------------
  # 4) Deploy na EC2 (somente na branch main, após imagem publicada)
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker rm -f simple-task-api || true
            docker run -d \
              --name simple-task-api \
              --restart unless-stopped \
              -p 3000:3000 \
              -v task-data:/app/data \
              ${{ env.IMAGE_NAME }}:latest
