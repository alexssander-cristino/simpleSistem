services:
  task-api:
    image: ${IMAGE:-simple-task-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simple-task-api
    ports:
      - "3000:3000"
    volumes:
      - task-data:/app/data
    environment:
      - PORT=3000
      - DB_PATH=/app/data/data.sqlite
    restart: unless-stopped

volumes:
  task-data:
